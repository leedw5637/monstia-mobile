name: Build MONSTIA APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 프로젝트 받기
        uses: actions/checkout@v5

      - name: Java 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: MONSTIA 프로젝트 위치 찾기
        shell: bash
        run: |
          APP_BUILD=$(find . -type f \( -path "*/app/build.gradle.kts" -o -path "*/app/build.gradle" \) | head -n 1)

          if [ -z "$APP_BUILD" ]; then
            echo "::error::app/build.gradle.kts를 찾지 못했습니다."
            exit 1
          fi

          GRADLE_ROOT=$(dirname "$(dirname "$APP_BUILD")")
          echo "Android 프로젝트 위치: $GRADLE_ROOT"
          echo "GRADLE_ROOT=$GRADLE_ROOT" >> "$GITHUB_ENV"

      - name: Gradle 루트 파일 보정
        shell: bash
        run: |
          if [ ! -f "$GRADLE_ROOT/settings.gradle.kts" ]; then
            cat > "$GRADLE_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MONSTIA"
          include(":app")
          EOF
          fi

          if [ ! -f "$GRADLE_ROOT/build.gradle.kts" ]; then
            cat > "$GRADLE_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF
          fi

          touch "$GRADLE_ROOT/gradle.properties"
          grep -q "^android.useAndroidX=" "$GRADLE_ROOT/gradle.properties" || echo "android.useAndroidX=true" >> "$GRADLE_ROOT/gradle.properties"
          grep -q "^android.nonTransitiveRClass=" "$GRADLE_ROOT/gradle.properties" || echo "android.nonTransitiveRClass=true" >> "$GRADLE_ROOT/gradle.properties"
          grep -q "^org.gradle.jvmargs=" "$GRADLE_ROOT/gradle.properties" || echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> "$GRADLE_ROOT/gradle.properties"

      - name: 누락된 Android 리소스 복구
        shell: bash
        run: |
          RES="$GRADLE_ROOT/app/src/main/res"
          MANIFEST="$GRADLE_ROOT/app/src/main/AndroidManifest.xml"

          mkdir -p "$RES/drawable" "$RES/values" "$RES/xml"

          ICON=$(find "$GITHUB_WORKSPACE" -type f \( -name "apk아이콘.png" -o -name "apk_icon.png" \) | head -n 1)

          if [ -z "$ICON" ]; then
            echo "::error::apk아이콘.png 파일을 저장소에서 찾지 못했습니다."
            exit 1
          fi

          cp "$ICON" "$RES/drawable/ic_launcher.png"

          cat > "$RES/values/styles.xml" <<'EOF'
          <resources>
              <style name="Theme.Monstia" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#2D66FF</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > "$RES/xml/file_paths.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="updates" path="updates/"/>
          </paths>
          EOF

          sed -i 's|@mipmap/ic_launcher_round|@drawable/ic_launcher|g' "$MANIFEST"
          sed -i 's|@mipmap/ic_launcher|@drawable/ic_launcher|g' "$MANIFEST"

      - name: 분할 게임 파일 합치기
        shell: bash
        run: |
          mkdir -p "$GRADLE_ROOT/app/src/main/assets"

          if [ -f "$GITHUB_WORKSPACE/game.html" ]; then
            cp "$GITHUB_WORKSPACE/game.html" "$GRADLE_ROOT/app/src/main/assets/game.html"
          else
            PARTS=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "game.part*" | sort)

            if [ -z "$PARTS" ]; then
              echo "::error::game.part01, game.part02, game.part03 파일을 저장소 최상단에 올려주세요."
              exit 1
            fi

            cat $PARTS > "$GRADLE_ROOT/app/src/main/assets/game.html"
          fi

          echo "복원된 game.html 크기:"
          ls -lh "$GRADLE_ROOT/app/src/main/assets/game.html"

          ACTUAL_SHA=$(sha256sum "$GRADLE_ROOT/app/src/main/assets/game.html" | awk '{print $1}')
          EXPECTED_SHA="aa8990cd82e3ed42777a5d7fdd6ed78c596429ea5c355808196b5af23cef0a50"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::game.html 복원 해시가 일치하지 않습니다."
            echo "actual=$ACTUAL_SHA"
            exit 1
          fi

      - name: 핵심 게임 파일 확인
        shell: bash
        run: |
          test -f "$GRADLE_ROOT/app/src/main/assets/game.html" || {
            echo "::error::game.html이 없습니다."
            exit 1
          }

          MAIN=$(find "$GRADLE_ROOT/app/src/main" -type f \( -name "MainActivity.java" -o -name "MainActivity.kt" \) | head -n 1)
          if [ -z "$MAIN" ]; then
            echo "::error::MainActivity 파일이 없습니다."
            exit 1
          fi

      - name: MONSTIA 자동 업데이트 주소 설정
        shell: bash
        run: |
          PROJECT_PATH="${GRADLE_ROOT#./}"
          if [ "$PROJECT_PATH" = "." ]; then
            PROJECT_PATH=""
          fi

          if [ -n "$PROJECT_PATH" ]; then
            UPDATE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${PROJECT_PATH}/release/update.json"
          else
            UPDATE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/release/update.json"
          fi

          sed -i '/^MONSTIA_UPDATE_URL=/d' "$GRADLE_ROOT/gradle.properties"
          echo "MONSTIA_UPDATE_URL=$UPDATE_URL" >> "$GRADLE_ROOT/gradle.properties"

      - name: APK 서명키 복원
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 Secret이 없습니다."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/monstia-release.jks"

      - name: MONSTIA APK 빌드
        shell: bash
        env:
          MONSTIA_KEYSTORE_PATH: ${{ runner.temp }}/monstia-release.jks
          MONSTIA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MONSTIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MONSTIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd "$GRADLE_ROOT"
          gradle :app:assembleRelease --stacktrace

      - name: APK 파일 준비
        shell: bash
        run: |
          APK=$(find "$GRADLE_ROOT/app/build/outputs/apk/release" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::생성된 APK 파일을 찾지 못했습니다."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MONSTIA.apk"

      - name: APK 다운로드 등록
        uses: actions/upload-artifact@v4
        with:
          name: MONSTIA-APK
          path: MONSTIA.apk

      - name: 최신 MONSTIA Release 등록
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-latest"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "MONSTIA Android" \
              --notes "MONSTIA Android 최신 APK"

          gh release upload "$TAG" MONSTIA.apk --clobber
              --notes "MONSTIA Android 최신 APK"

          gh release upload "$TAG" MONSTIA.apk --clobber
