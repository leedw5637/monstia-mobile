name: Build MONSTIA APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 프로젝트 받기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: MONSTIA 프로젝트 위치 찾기
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle 프로젝트를 찾지 못했습니다."
            echo "현재 저장소 파일:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          GRADLE_ROOT=$(dirname "$SETTINGS_FILE")
          echo "Gradle 프로젝트 위치: $GRADLE_ROOT"
          echo "GRADLE_ROOT=$GRADLE_ROOT" >> "$GITHUB_ENV"

      - name: 자동 업데이트 주소 설정
        shell: bash
        run: |
          echo "MONSTIA_UPDATE_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/release/update.json" >> "$GRADLE_ROOT/gradle.properties"

      - name: APK 서명키 복원
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 Secret이 없습니다."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/monstia-release.jks"

      - name: MONSTIA APK 빌드
        shell: bash
        env:
          MONSTIA_KEYSTORE_PATH: ${{ runner.temp }}/monstia-release.jks
          MONSTIA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MONSTIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MONSTIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd "$GRADLE_ROOT"
          gradle :app:assembleRelease

      - name: APK 파일 준비
        shell: bash
        run: |
          APK=$(find "$GRADLE_ROOT/app/build/outputs/apk/release" -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "생성된 APK를 찾지 못했습니다."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MONSTIA.apk"

      - name: APK 다운로드 파일 등록
        uses: actions/upload-artifact@v4
        with:
          name: MONSTIA-APK
          path: MONSTIA.apk

      - name: MONSTIA Release 생성
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-latest"

          gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" \
            --title "MONSTIA Android" \
            --notes "MONSTIA Android 최신 버전"

          gh release upload "$TAG" MONSTIA.apk --clobber
