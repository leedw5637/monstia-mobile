name: Build MONSTIA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "release/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure MONSTIA update server
        shell: bash
        run: |
          echo "MONSTIA_UPDATE_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/release/update.json" >> gradle.properties

      - name: Restore Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/monstia-release.jks"

      - name: Build signed release APK
        env:
          MONSTIA_KEYSTORE_PATH: ${{ runner.temp }}/monstia-release.jks
          MONSTIA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MONSTIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MONSTIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk MONSTIA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MONSTIA-APK
          path: MONSTIA.apk

      - name: Create or update latest release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-latest"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "MONSTIA Android" --notes "Latest MONSTIA Android APK"
          gh release upload "$TAG" MONSTIA.apk --clobber
