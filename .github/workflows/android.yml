name: Build MONSTIA APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v5

      - name: Java 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 필수 파일 확인
        shell: bash
        run: |
          set -e
          for f in game.part01 game.part02 game.part03 "apk아이콘.png"; do
            if [ ! -f "$GITHUB_WORKSPACE/$f" ]; then
              echo "::error::$f 파일이 저장소 최상단에 없습니다."
              exit 1
            fi
          done
          echo "게임 분할파일 3개와 APK 아이콘 확인 완료"

      - name: MONSTIA Android 프로젝트 자동 생성
        shell: bash
        run: |
          set -e

          PROJECT="$RUNNER_TEMP/monstia-build"
          APP="$PROJECT/app"
          MAIN="$APP/src/main"

          rm -rf "$PROJECT"
          mkdir -p \
            "$MAIN/java/com/monstia/game" \
            "$MAIN/assets" \
            "$MAIN/res/drawable" \
            "$MAIN/res/values" \
            "$MAIN/res/xml"

          # 54MB 게임 본체 복원
          cat \
            "$GITHUB_WORKSPACE/game.part01" \
            "$GITHUB_WORKSPACE/game.part02" \
            "$GITHUB_WORKSPACE/game.part03" \
            > "$MAIN/assets/game.html"

          GAME_SHA256=$(sha256sum "$MAIN/assets/game.html" | awk '{print $1}')
          GAME_VERSION=$(python3 - "$MAIN/assets/game.html" <<'PY'
          import re, sys
          p = sys.argv[1]
          text = open(p, "r", encoding="utf-8", errors="ignore").read()
          m = re.search(r"const\s+GAME_VERSION\s*=\s*['\"]([^'\"]+)['\"]", text)
          if not m:
              raise SystemExit("GAME_VERSION을 game.html에서 찾지 못했습니다.")
          print(m.group(1))
          PY
          )

          echo "GAME_VERSION=$GAME_VERSION" >> "$GITHUB_ENV"
          echo "GAME_SHA256=$GAME_SHA256" >> "$GITHUB_ENV"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "MONSTIA 게임 버전: $GAME_VERSION"
          echo "MONSTIA SHA-256: $GAME_SHA256"

          # 사용자가 제공한 아이콘 적용
          cp "$GITHUB_WORKSPACE/apk아이콘.png" "$MAIN/res/drawable/ic_launcher.png"

          cat > "$PROJECT/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MONSTIA"
          include(":app")
          EOF

          cat > "$PROJECT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > "$PROJECT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > "$APP/build.gradle.kts" <<EOF
          plugins {
              id("com.android.application")
          }

          val keystorePath = System.getenv("MONSTIA_KEYSTORE_PATH")
          val keystorePassword = System.getenv("MONSTIA_KEYSTORE_PASSWORD")
          val keyAliasValue = System.getenv("MONSTIA_KEY_ALIAS")
          val keyPasswordValue = System.getenv("MONSTIA_KEY_PASSWORD")

          android {
              namespace = "com.monstia.game"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.monstia.game"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "$GAME_VERSION"

                  buildConfigField("String", "BUNDLED_GAME_VERSION", "\\"$GAME_VERSION\\"")
                  buildConfigField(
                      "String",
                      "UPDATE_MANIFEST_URL",
                      "\\"https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/update.json\\""
                  )
              }

              buildFeatures {
                  buildConfig = true
              }

              signingConfigs {
                  create("release") {
                      storeFile = file(keystorePath ?: error("MONSTIA_KEYSTORE_PATH missing"))
                      storePassword = keystorePassword
                      keyAlias = keyAliasValue
                      keyPassword = keyPasswordValue
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation("androidx.core:core:1.15.0")
          }
          EOF

          cat > "$MAIN/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="MONSTIA"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.Monstia">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"/>
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$MAIN/res/values/styles.xml" <<'EOF'
          <resources>
              <style name="Theme.Monstia" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#2D66FF</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > "$MAIN/res/xml/file_paths.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="updates" path="updates/"/>
          </paths>
          EOF

          cat > "$MAIN/java/com/monstia/game/MainActivity.java" <<'EOF'
          package com.monstia.game;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.core.content.FileProvider;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;
              private static final int INSTALL_PERMISSION_REQUEST = 1002;
              private final ExecutorService io = Executors.newSingleThreadExecutor();
              private File pendingApk;

              private File gameDir() {
                  return new File(getFilesDir(), "game");
              }

              private File activeGame() {
                  return new File(gameDir(), "game.html");
              }

              private SharedPreferences prefs() {
                  return getSharedPreferences("monstia_shell", MODE_PRIVATE);
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );
                  hideSystemUi();

                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF000000);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params
                      ) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;

                          try {
                              startActivityForResult(params.createIntent(), FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                  });

                  io.execute(() -> {
                      try {
                          prepareBundledGame();
                      } catch (Exception e) {
                          e.printStackTrace();
                      }

                      runOnUiThread(this::loadGame);
                      checkForUpdates();
                  });
              }

              private void hideSystemUi() {
                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      if (getWindow().getInsetsController() != null) {
                          getWindow().getInsetsController().hide(
                                  WindowInsets.Type.statusBars() |
                                  WindowInsets.Type.navigationBars()
                          );
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN |
                              View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                              View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                              View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }

              private void prepareBundledGame() throws Exception {
                  File dir = gameDir();
                  if (!dir.exists()) {
                      dir.mkdirs();
                  }

                  File out = activeGame();
                  String installed = prefs().getString("game_version", "");

                  if (!out.exists() ||
                          compareVersion(BuildConfig.BUNDLED_GAME_VERSION, installed) > 0) {
                      try (
                              InputStream in = getAssets().open("game.html");
                              OutputStream os = new FileOutputStream(out)
                      ) {
                          copy(in, os);
                      }

                      prefs().edit()
                              .putString("game_version", BuildConfig.BUNDLED_GAME_VERSION)
                              .apply();
                  }
              }

              private void loadGame() {
                  webView.loadUrl("file://" + activeGame().getAbsolutePath());
              }

              private void checkForUpdates() {
                  final String manifestUrl = BuildConfig.UPDATE_MANIFEST_URL;

                  if (manifestUrl == null || manifestUrl.trim().isEmpty()) {
                      return;
                  }

                  io.execute(() -> {
                      try {
                          JSONObject manifest = new JSONObject(httpText(manifestUrl));

                          String latestGame = manifest.optString("gameVersion", "");
                          String gameUrl = manifest.optString("gameUrl", "");
                          String expectedSha = manifest.optString("sha256", "");
                          String current = prefs().getString(
                                  "game_version",
                                  BuildConfig.BUNDLED_GAME_VERSION
                          );

                          if (!latestGame.isEmpty() &&
                                  !gameUrl.isEmpty() &&
                                  compareVersion(latestGame, current) > 0) {

                              File temp = new File(gameDir(), "game.new");
                              download(gameUrl, temp);

                              if (!expectedSha.isEmpty() &&
                                      !expectedSha.equalsIgnoreCase(sha256(temp))) {
                                  temp.delete();
                                  throw new IOException("game sha256 mismatch");
                              }

                              File target = activeGame();
                              File backup = new File(gameDir(), "game.previous.html");

                              if (backup.exists()) {
                                  backup.delete();
                              }
                              if (target.exists()) {
                                  target.renameTo(backup);
                              }
                              if (!temp.renameTo(target)) {
                                  throw new IOException("cannot activate game update");
                              }

                              prefs().edit()
                                      .putString("game_version", latestGame)
                                      .apply();

                              runOnUiThread(() ->
                                      new AlertDialog.Builder(this)
                                              .setTitle("MONSTIA 업데이트 완료")
                                              .setMessage(
                                                      "새 게임 버전 " +
                                                      latestGame +
                                                      "이 자동 적용되었습니다."
                                              )
                                              .setPositiveButton(
                                                      "재시작",
                                                      (d, w) -> loadGame()
                                              )
                                              .setCancelable(false)
                                              .show()
                              );
                          }

                          int latestCode = manifest.optInt("apkVersionCode", 0);
                          String apkUrl = manifest.optString("apkUrl", "");

                          if (latestCode > BuildConfig.VERSION_CODE &&
                                  !apkUrl.isEmpty()) {
                              runOnUiThread(() ->
                                      new AlertDialog.Builder(this)
                                              .setTitle("앱 업데이트")
                                              .setMessage(
                                                      "새 MONSTIA 앱 버전이 있습니다. " +
                                                      "다운로드 후 Android 설치 확인 화면이 열립니다."
                                              )
                                              .setPositiveButton(
                                                      "업데이트",
                                                      (d, w) -> downloadAndInstallApk(apkUrl)
                                              )
                                              .setNegativeButton("나중에", null)
                                              .show()
                              );
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  });
              }

              private void downloadAndInstallApk(String url) {
                  io.execute(() -> {
                      try {
                          File dir = new File(getCacheDir(), "updates");
                          if (!dir.exists()) {
                              dir.mkdirs();
                          }

                          File apk = new File(dir, "monstia-update.apk");
                          download(url, apk);
                          pendingApk = apk;

                          runOnUiThread(this::requestInstallOrOpen);
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  });
              }

              private void requestInstallOrOpen() {
                  if (android.os.Build.VERSION.SDK_INT >= 26 &&
                          !getPackageManager().canRequestPackageInstalls()) {
                      Intent i = new Intent(
                              Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getPackageName())
                      );
                      startActivityForResult(i, INSTALL_PERMISSION_REQUEST);
                      return;
                  }

                  openInstaller();
              }

              private void openInstaller() {
                  if (pendingApk == null || !pendingApk.exists()) {
                      return;
                  }

                  Uri uri = FileProvider.getUriForFile(
                          this,
                          getPackageName() + ".fileprovider",
                          pendingApk
                  );

                  Intent intent = new Intent(Intent.ACTION_VIEW);
                  intent.setDataAndType(
                          uri,
                          "application/vnd.android.package-archive"
                  );
                  intent.addFlags(
                          Intent.FLAG_GRANT_READ_URI_PERMISSION |
                          Intent.FLAG_ACTIVITY_NEW_TASK
                  );
                  startActivity(intent);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      Uri[] results = null;

                      if (resultCode == RESULT_OK && data != null) {
                          Uri u = data.getData();
                          if (u != null) {
                              results = new Uri[]{u};
                          }
                      }

                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(results);
                      }

                      filePathCallback = null;
                  } else if (requestCode == INSTALL_PERMISSION_REQUEST) {
                      requestInstallOrOpen();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  io.shutdownNow();

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }

              private static String httpText(String url) throws Exception {
                  HttpURLConnection c =
                          (HttpURLConnection) new URL(url).openConnection();

                  c.setConnectTimeout(10000);
                  c.setReadTimeout(15000);
                  c.setInstanceFollowRedirects(true);
                  c.setRequestProperty("User-Agent", "MONSTIA-Android");

                  try (InputStream in = c.getInputStream()) {
                      return new String(
                              readAll(in),
                              StandardCharsets.UTF_8
                      );
                  } finally {
                      c.disconnect();
                  }
              }

              private static void download(String url, File out)
                      throws Exception {
                  HttpURLConnection c =
                          (HttpURLConnection) new URL(url).openConnection();

                  c.setConnectTimeout(10000);
                  c.setReadTimeout(60000);
                  c.setInstanceFollowRedirects(true);
                  c.setRequestProperty("User-Agent", "MONSTIA-Android");

                  try (
                          InputStream in = c.getInputStream();
                          OutputStream os = new FileOutputStream(out)
                  ) {
                      copy(in, os);
                  } finally {
                      c.disconnect();
                  }
              }

              private static byte[] readAll(InputStream in)
                      throws IOException {
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  copy(in, b);
                  return b.toByteArray();
              }

              private static void copy(InputStream in, OutputStream out)
                      throws IOException {
                  byte[] buf = new byte[64 * 1024];
                  int n;

                  while ((n = in.read(buf)) >= 0) {
                      out.write(buf, 0, n);
                  }
              }

              private static String sha256(File file) throws Exception {
                  MessageDigest md =
                          MessageDigest.getInstance("SHA-256");

                  try (InputStream in = new FileInputStream(file)) {
                      byte[] b = new byte[64 * 1024];
                      int n;

                      while ((n = in.read(b)) >= 0) {
                          md.update(b, 0, n);
                      }
                  }

                  StringBuilder sb = new StringBuilder();

                  for (byte x : md.digest()) {
                      sb.append(String.format(Locale.US, "%02x", x));
                  }

                  return sb.toString();
              }

              private static int compareVersion(String a, String b) {
                  String[] aa = (a == null ? "" : a).split("\\.");
                  String[] bb = (b == null ? "" : b).split("\\.");

                  int n = Math.max(aa.length, bb.length);

                  for (int i = 0; i < n; i++) {
                      int x = i < aa.length ? num(aa[i]) : 0;
                      int y = i < bb.length ? num(bb[i]) : 0;

                      if (x != y) {
                          return Integer.compare(x, y);
                      }
                  }

                  return 0;
              }

              private static int num(String s) {
                  try {
                      return Integer.parseInt(
                              s.replaceAll("[^0-9].*$", "")
                      );
                  } catch (Exception e) {
                      return 0;
                  }
              }
          }
          EOF

      - name: APK 서명키 복원
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 Secret이 없습니다."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/monstia-release.jks"

      - name: MONSTIA APK 빌드
        shell: bash
        env:
          MONSTIA_KEYSTORE_PATH: ${{ runner.temp }}/monstia-release.jks
          MONSTIA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MONSTIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MONSTIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          cd "$PROJECT"
          gradle :app:assembleRelease --stacktrace

      - name: APK 및 자동업데이트 파일 준비
        shell: bash
        run: |
          set -e

          APK="$PROJECT/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::생성된 APK를 찾지 못했습니다."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MONSTIA.apk"
          cp "$PROJECT/app/src/main/assets/game.html" \
             "$GITHUB_WORKSPACE/MONSTIA_latest.html"

          cat > "$GITHUB_WORKSPACE/update.json" <<EOF
          {
            "gameVersion": "$GAME_VERSION",
            "gameUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/MONSTIA_latest.html",
            "sha256": "$GAME_SHA256",
            "apkVersionCode": 1,
            "apkVersionName": "$GAME_VERSION",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/MONSTIA.apk"
          }
          EOF

          echo "APK/게임/업데이트 매니페스트 준비 완료"

      - name: APK 다운로드 파일 등록
        uses: actions/upload-artifact@v4
        with:
          name: MONSTIA-APK
          path: MONSTIA.apk

      - name: 고정 Release 생성 및 자동업데이트 파일 게시
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="android-latest"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "MONSTIA Android" \
              --notes "MONSTIA Android 자동 업데이트 배포"

          gh release upload "$TAG" \
            MONSTIA.apk \
            MONSTIA_latest.html \
            update.json \
            --clobber

          echo "MONSTIA Release 게시 완료"
