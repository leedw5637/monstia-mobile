name: Build MONSTIA APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 프로젝트 받기
        uses: actions/checkout@v5

      - name: Java 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: MONSTIA 프로젝트 위치 찾기
        shell: bash
        run: |
          APP_BUILD=$(find . -type f \( -path "*/app/build.gradle.kts" -o -path "*/app/build.gradle" \) | head -n 1)

          if [ -z "$APP_BUILD" ]; then
            echo "app/build.gradle.kts 를 찾지 못했습니다."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          GRADLE_ROOT=$(dirname "$(dirname "$APP_BUILD")")

          echo "Android 프로젝트 위치: $GRADLE_ROOT"
          echo "GRADLE_ROOT=$GRADLE_ROOT" >> "$GITHUB_ENV"

      - name: 누락된 Gradle 파일 자동 생성
        shell: bash
        run: |
          if [ ! -f "$GRADLE_ROOT/settings.gradle.kts" ]; then
            cat > "$GRADLE_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MONSTIA"
          include(":app")
          EOF
          fi

          if [ ! -f "$GRADLE_ROOT/build.gradle.kts" ]; then
            cat > "$GRADLE_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF
          fi

          touch "$GRADLE_ROOT/gradle.properties"

          grep -q "android.useAndroidX" "$GRADLE_ROOT/gradle.properties" || \
            echo "android.useAndroidX=true" >> "$GRADLE_ROOT/gradle.properties"

          grep -q "android.nonTransitiveRClass" "$GRADLE_ROOT/gradle.properties" || \
            echo "android.nonTransitiveRClass=true" >> "$GRADLE_ROOT/gradle.properties"

          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> "$GRADLE_ROOT/gradle.properties"

      - name: MONSTIA 자동 업데이트 주소 설정
        shell: bash
        run: |
          PROJECT_PATH="${GRADLE_ROOT#./}"

          if [ "$PROJECT_PATH" = "." ]; then
            PROJECT_PATH=""
          fi

          if [ -n "$PROJECT_PATH" ]; then
            UPDATE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${PROJECT_PATH}/release/update.json"
          else
            UPDATE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/release/update.json"
          fi

          echo "자동 업데이트 주소: $UPDATE_URL"
          echo "MONSTIA_UPDATE_URL=$UPDATE_URL" >> "$GRADLE_ROOT/gradle.properties"

      - name: APK 서명키 복원
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 Secret이 없습니다."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/monstia-release.jks"

      - name: MONSTIA APK 빌드
        shell: bash
        env:
          MONSTIA_KEYSTORE_PATH: ${{ runner.temp }}/monstia-release.jks
          MONSTIA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MONSTIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MONSTIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd "$GRADLE_ROOT"
          gradle :app:assembleRelease --stacktrace

      - name: APK 파일 찾기
        shell: bash
        run: |
          APK=$(find "$GRADLE_ROOT/app/build/outputs/apk/release" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK 파일을 찾지 못했습니다."
            find "$GRADLE_ROOT/app/build" -type f | sort || true
            exit 1
          fi

          echo "생성 APK: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/MONSTIA.apk"

      - name: APK 다운로드 등록
        uses: actions/upload-artifact@v4
        with:
          name: MONSTIA-APK
          path: MONSTIA.apk

      - name: 최신 MONSTIA Release 등록
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-latest"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "MONSTIA Android" \
              --notes "MONSTIA Android 최신 APK"

          gh release upload "$TAG" MONSTIA.apk --clobber
